{{- $disabled := .Values.prometheusRules.disabled }}
{{- $groups := dict
  "availability" (list "GarageNodeDown" "GarageHighRPCErrorRate")
  "storage" (list "GarageBlockResyncErrors" "GarageHighBlockResyncQueue" "GarageLowDiskSpace")
  "quota" (list "GarageBucketSizeQuotaNearLimit" "GarageBucketObjectQuotaNearLimit")
  "cluster" (list "GarageClusterUnhealthy" "GarageClusterUnavailable" "GarageStorageNodeDown" "GaragePartitionsDegraded" "GarageNodeDisconnected")
}}
{{- $enabled := dict }}
{{- range $group, $rules := $groups }}
{{- range $rules }}
{{- if not (get $disabled . | default false) }}
{{- $_ := set $enabled $group true }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.prometheusRules.enabled $enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "garage-operator.fullname" . }}-garage
  namespace: {{ .Values.prometheusRules.namespace | default .Release.Namespace }}
  labels:
    {{- include "garage-operator.labels" . | nindent 4 }}
    {{- with .Values.prometheusRules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
{{- if $enabled.availability }}
    - name: garage.availability
      rules:
{{- if not (.Values.prometheusRules.disabled.GarageNodeDown | default false) }}
{{- $for := dig "GarageNodeDown" "for" "5m" .Values.prometheusRules.customRules }}
        - alert: GarageNodeDown
          annotations:
{{- if .Values.prometheusRules.additionalRuleAnnotations }}
{{ toYaml .Values.prometheusRules.additionalRuleAnnotations | indent 12 }}
{{- end }}
{{- if .Values.prometheusRules.additionalRuleGroupAnnotations.availability }}
{{ toYaml .Values.prometheusRules.additionalRuleGroupAnnotations.availability | indent 12 }}
{{- end }}
            summary: "Garage node {{ "{{" }} $labels.instance {{ "}}" }} is down"
            description: "Garage node {{ "{{" }} $labels.instance {{ "}}" }} has been unreachable for more than {{ $for }}."
          expr: up{job="garage"} == 0
          for: {{ $for }}
          {{- with .Values.prometheusRules.keepFiringFor }}
          keep_firing_for: "{{ . }}"
          {{- end }}
          labels:
            severity: {{ dig "GarageNodeDown" "severity" "critical" .Values.prometheusRules.customRules }}
          {{- if or .Values.prometheusRules.additionalRuleLabels .Values.prometheusRules.additionalRuleGroupLabels.availability }}
            {{- with .Values.prometheusRules.additionalRuleLabels }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.prometheusRules.additionalRuleGroupLabels.availability }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
{{- end }}
{{- if not (.Values.prometheusRules.disabled.GarageHighRPCErrorRate | default false) }}
{{- $for := dig "GarageHighRPCErrorRate" "for" "10m" .Values.prometheusRules.customRules }}
        - alert: GarageHighRPCErrorRate
          annotations:
{{- if .Values.prometheusRules.additionalRuleAnnotations }}
{{ toYaml .Values.prometheusRules.additionalRuleAnnotations | indent 12 }}
{{- end }}
{{- if .Values.prometheusRules.additionalRuleGroupAnnotations.availability }}
{{ toYaml .Values.prometheusRules.additionalRuleGroupAnnotations.availability | indent 12 }}
{{- end }}
            summary: "High RPC error rate on {{ "{{" }} $labels.instance {{ "}}" }}"
            description: "More than 10% of RPC requests are failing on {{ "{{" }} $labels.instance {{ "}}" }} for {{ $for }}."
          # rate() drops __name__; keep each counter family distinct until sum.
          # Otherwise identical remaining labels collide and the rule fails to evaluate.
          expr: |
            sum by (instance) (
              label_replace(rate(rpc_netapp_error_counter{job="garage"}[5m]), "error_type", "netapp", "", "")
              or
              label_replace(rate(rpc_garage_error_counter{job="garage"}[5m]), "error_type", "garage", "", "")
              or
              label_replace(rate(rpc_timeout_counter{job="garage"}[5m]), "error_type", "timeout", "", "")
            )
            /
            sum by (instance) (rate(rpc_request_counter{job="garage"}[5m])) > 0.1
          for: {{ $for }}
          {{- with .Values.prometheusRules.keepFiringFor }}
          keep_firing_for: "{{ . }}"
          {{- end }}
          labels:
            severity: {{ dig "GarageHighRPCErrorRate" "severity" "warning" .Values.prometheusRules.customRules }}
          {{- if or .Values.prometheusRules.additionalRuleLabels .Values.prometheusRules.additionalRuleGroupLabels.availability }}
            {{- with .Values.prometheusRules.additionalRuleLabels }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.prometheusRules.additionalRuleGroupLabels.availability }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
{{- end }}
{{- end }}
{{- if $enabled.storage }}
    - name: garage.storage
      rules:
{{- if not (.Values.prometheusRules.disabled.GarageBlockResyncErrors | default false) }}
{{- $for := dig "GarageBlockResyncErrors" "for" "15m" .Values.prometheusRules.customRules }}
        - alert: GarageBlockResyncErrors
          annotations:
{{- if .Values.prometheusRules.additionalRuleAnnotations }}
{{ toYaml .Values.prometheusRules.additionalRuleAnnotations | indent 12 }}
{{- end }}
{{- if .Values.prometheusRules.additionalRuleGroupAnnotations.storage }}
{{ toYaml .Values.prometheusRules.additionalRuleGroupAnnotations.storage | indent 12 }}
{{- end }}
            summary: "Garage block resync errors on {{ "{{" }} $labels.instance {{ "}}" }}"
            description: "{{ "{{" }} $value {{ "}}" }} blocks failed to resync on {{ "{{" }} $labels.instance {{ "}}" }}. Data integrity may be affected."
          expr: block_resync_errored_blocks{job="garage"} > 0
          for: {{ $for }}
          {{- with .Values.prometheusRules.keepFiringFor }}
          keep_firing_for: "{{ . }}"
          {{- end }}
          labels:
            severity: {{ dig "GarageBlockResyncErrors" "severity" "warning" .Values.prometheusRules.customRules }}
          {{- if or .Values.prometheusRules.additionalRuleLabels .Values.prometheusRules.additionalRuleGroupLabels.storage }}
            {{- with .Values.prometheusRules.additionalRuleLabels }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.prometheusRules.additionalRuleGroupLabels.storage }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
{{- end }}
{{- if not (.Values.prometheusRules.disabled.GarageHighBlockResyncQueue | default false) }}
{{- $for := dig "GarageHighBlockResyncQueue" "for" "30m" .Values.prometheusRules.customRules }}
        - alert: GarageHighBlockResyncQueue
          annotations:
{{- if .Values.prometheusRules.additionalRuleAnnotations }}
{{ toYaml .Values.prometheusRules.additionalRuleAnnotations | indent 12 }}
{{- end }}
{{- if .Values.prometheusRules.additionalRuleGroupAnnotations.storage }}
{{ toYaml .Values.prometheusRules.additionalRuleGroupAnnotations.storage | indent 12 }}
{{- end }}
            summary: "Large block resync queue on {{ "{{" }} $labels.instance {{ "}}" }}"
            description: "Block resync queue has {{ "{{" }} $value {{ "}}" }} items on {{ "{{" }} $labels.instance {{ "}}" }} for {{ $for }}."
          expr: block_resync_queue_length{job="garage"} > 10000
          for: {{ $for }}
          {{- with .Values.prometheusRules.keepFiringFor }}
          keep_firing_for: "{{ . }}"
          {{- end }}
          labels:
            severity: {{ dig "GarageHighBlockResyncQueue" "severity" "warning" .Values.prometheusRules.customRules }}
          {{- if or .Values.prometheusRules.additionalRuleLabels .Values.prometheusRules.additionalRuleGroupLabels.storage }}
            {{- with .Values.prometheusRules.additionalRuleLabels }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.prometheusRules.additionalRuleGroupLabels.storage }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
{{- end }}
{{- if not (.Values.prometheusRules.disabled.GarageLowDiskSpace | default false) }}
{{- $for := dig "GarageLowDiskSpace" "for" "5m" .Values.prometheusRules.customRules }}
        - alert: GarageLowDiskSpace
          annotations:
{{- if .Values.prometheusRules.additionalRuleAnnotations }}
{{ toYaml .Values.prometheusRules.additionalRuleAnnotations | indent 12 }}
{{- end }}
{{- if .Values.prometheusRules.additionalRuleGroupAnnotations.storage }}
{{ toYaml .Values.prometheusRules.additionalRuleGroupAnnotations.storage | indent 12 }}
{{- end }}
            summary: "Low disk space on Garage node {{ "{{" }} $labels.instance {{ "}}" }}"
            description: "Garage node {{ "{{" }} $labels.instance {{ "}}" }} has less than 10% disk space remaining."
          expr: |
            (garage_local_disk_avail{job="garage"} / garage_local_disk_total{job="garage"}) < 0.1
          for: {{ $for }}
          {{- with .Values.prometheusRules.keepFiringFor }}
          keep_firing_for: "{{ . }}"
          {{- end }}
          labels:
            severity: {{ dig "GarageLowDiskSpace" "severity" "critical" .Values.prometheusRules.customRules }}
          {{- if or .Values.prometheusRules.additionalRuleLabels .Values.prometheusRules.additionalRuleGroupLabels.storage }}
            {{- with .Values.prometheusRules.additionalRuleLabels }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.prometheusRules.additionalRuleGroupLabels.storage }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
{{- end }}
{{- end }}
{{- if $enabled.quota }}
    - name: garage.quota
      rules:
{{- if not (.Values.prometheusRules.disabled.GarageBucketSizeQuotaNearLimit | default false) }}
{{- $for := dig "GarageBucketSizeQuotaNearLimit" "for" "15m" .Values.prometheusRules.customRules }}
        - alert: GarageBucketSizeQuotaNearLimit
          annotations:
{{- if .Values.prometheusRules.additionalRuleAnnotations }}
{{ toYaml .Values.prometheusRules.additionalRuleAnnotations | indent 12 }}
{{- end }}
{{- if .Values.prometheusRules.additionalRuleGroupAnnotations.quota }}
{{ toYaml .Values.prometheusRules.additionalRuleGroupAnnotations.quota | indent 12 }}
{{- end }}
            summary: "Garage bucket {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.bucket {{ "}}" }} is near its size quota"
            description: "Garage bucket {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.bucket {{ "}}" }} has used {{ "{{" }} $value | humanizePercentage {{ "}}" }} of its configured size quota for {{ $for }}."
          expr: |
            garage_operator_bucket_quota_size_utilization_ratio > 0.9
            and on (namespace, bucket)
            garage_operator_bucket_size_limit_bytes > 0
          for: {{ $for }}
          {{- with .Values.prometheusRules.keepFiringFor }}
          keep_firing_for: "{{ . }}"
          {{- end }}
          labels:
            severity: {{ dig "GarageBucketSizeQuotaNearLimit" "severity" "warning" .Values.prometheusRules.customRules }}
          {{- if or .Values.prometheusRules.additionalRuleLabels .Values.prometheusRules.additionalRuleGroupLabels.quota }}
            {{- with .Values.prometheusRules.additionalRuleLabels }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.prometheusRules.additionalRuleGroupLabels.quota }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
{{- end }}
{{- if not (.Values.prometheusRules.disabled.GarageBucketObjectQuotaNearLimit | default false) }}
{{- $for := dig "GarageBucketObjectQuotaNearLimit" "for" "15m" .Values.prometheusRules.customRules }}
        - alert: GarageBucketObjectQuotaNearLimit
          annotations:
{{- if .Values.prometheusRules.additionalRuleAnnotations }}
{{ toYaml .Values.prometheusRules.additionalRuleAnnotations | indent 12 }}
{{- end }}
{{- if .Values.prometheusRules.additionalRuleGroupAnnotations.quota }}
{{ toYaml .Values.prometheusRules.additionalRuleGroupAnnotations.quota | indent 12 }}
{{- end }}
            summary: "Garage bucket {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.bucket {{ "}}" }} is near its object quota"
            description: "Garage bucket {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.bucket {{ "}}" }} has used {{ "{{" }} $value | humanizePercentage {{ "}}" }} of its configured object quota for {{ $for }}."
          expr: |
            garage_operator_bucket_quota_object_utilization_ratio > 0.9
            and on (namespace, bucket)
            garage_operator_bucket_object_limit > 0
          for: {{ $for }}
          {{- with .Values.prometheusRules.keepFiringFor }}
          keep_firing_for: "{{ . }}"
          {{- end }}
          labels:
            severity: {{ dig "GarageBucketObjectQuotaNearLimit" "severity" "warning" .Values.prometheusRules.customRules }}
          {{- if or .Values.prometheusRules.additionalRuleLabels .Values.prometheusRules.additionalRuleGroupLabels.quota }}
            {{- with .Values.prometheusRules.additionalRuleLabels }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.prometheusRules.additionalRuleGroupLabels.quota }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
{{- end }}
{{- end }}
{{- if $enabled.cluster }}
    - name: garage.cluster
      rules:
{{- if not (.Values.prometheusRules.disabled.GarageClusterUnhealthy | default false) }}
{{- $for := dig "GarageClusterUnhealthy" "for" "2m" .Values.prometheusRules.customRules }}
        - alert: GarageClusterUnhealthy
          annotations:
{{- if .Values.prometheusRules.additionalRuleAnnotations }}
{{ toYaml .Values.prometheusRules.additionalRuleAnnotations | indent 12 }}
{{- end }}
{{- if .Values.prometheusRules.additionalRuleGroupAnnotations.cluster }}
{{ toYaml .Values.prometheusRules.additionalRuleGroupAnnotations.cluster | indent 12 }}
{{- end }}
            summary: "Garage cluster unhealthy on {{ "{{" }} $labels.instance {{ "}}" }}"
            description: "Garage cluster is reporting unhealthy status for at least {{ $for }}. Data may be unavailable."
          expr: cluster_healthy{job="garage"} == 0
          for: {{ $for }}
          {{- with .Values.prometheusRules.keepFiringFor }}
          keep_firing_for: "{{ . }}"
          {{- end }}
          labels:
            severity: {{ dig "GarageClusterUnhealthy" "severity" "critical" .Values.prometheusRules.customRules }}
          {{- if or .Values.prometheusRules.additionalRuleLabels .Values.prometheusRules.additionalRuleGroupLabels.cluster }}
            {{- with .Values.prometheusRules.additionalRuleLabels }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.prometheusRules.additionalRuleGroupLabels.cluster }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
{{- end }}
{{- if not (.Values.prometheusRules.disabled.GarageClusterUnavailable | default false) }}
{{- $for := dig "GarageClusterUnavailable" "for" "1m" .Values.prometheusRules.customRules }}
        - alert: GarageClusterUnavailable
          annotations:
{{- if .Values.prometheusRules.additionalRuleAnnotations }}
{{ toYaml .Values.prometheusRules.additionalRuleAnnotations | indent 12 }}
{{- end }}
{{- if .Values.prometheusRules.additionalRuleGroupAnnotations.cluster }}
{{ toYaml .Values.prometheusRules.additionalRuleGroupAnnotations.cluster | indent 12 }}
{{- end }}
            summary: "Garage cluster unavailable on {{ "{{" }} $labels.instance {{ "}}" }}"
            description: "Garage cluster cannot serve requests (quorum lost) for at least {{ $for }}."
          expr: cluster_available{job="garage"} == 0
          for: {{ $for }}
          {{- with .Values.prometheusRules.keepFiringFor }}
          keep_firing_for: "{{ . }}"
          {{- end }}
          labels:
            severity: {{ dig "GarageClusterUnavailable" "severity" "critical" .Values.prometheusRules.customRules }}
          {{- if or .Values.prometheusRules.additionalRuleLabels .Values.prometheusRules.additionalRuleGroupLabels.cluster }}
            {{- with .Values.prometheusRules.additionalRuleLabels }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.prometheusRules.additionalRuleGroupLabels.cluster }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
{{- end }}
{{- if not (.Values.prometheusRules.disabled.GarageStorageNodeDown | default false) }}
{{- $for := dig "GarageStorageNodeDown" "for" "5m" .Values.prometheusRules.customRules }}
        - alert: GarageStorageNodeDown
          annotations:
{{- if .Values.prometheusRules.additionalRuleAnnotations }}
{{ toYaml .Values.prometheusRules.additionalRuleAnnotations | indent 12 }}
{{- end }}
{{- if .Values.prometheusRules.additionalRuleGroupAnnotations.cluster }}
{{ toYaml .Values.prometheusRules.additionalRuleGroupAnnotations.cluster | indent 12 }}
{{- end }}
            summary: "Garage storage node(s) down on {{ "{{" }} $labels.instance {{ "}}" }}"
            description: "Not all storage nodes are healthy."
          expr: cluster_storage_nodes_ok{job="garage"} < cluster_storage_nodes{job="garage"}
          for: {{ $for }}
          {{- with .Values.prometheusRules.keepFiringFor }}
          keep_firing_for: "{{ . }}"
          {{- end }}
          labels:
            severity: {{ dig "GarageStorageNodeDown" "severity" "warning" .Values.prometheusRules.customRules }}
          {{- if or .Values.prometheusRules.additionalRuleLabels .Values.prometheusRules.additionalRuleGroupLabels.cluster }}
            {{- with .Values.prometheusRules.additionalRuleLabels }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.prometheusRules.additionalRuleGroupLabels.cluster }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
{{- end }}
{{- if not (.Values.prometheusRules.disabled.GaragePartitionsDegraded | default false) }}
{{- $for := dig "GaragePartitionsDegraded" "for" "10m" .Values.prometheusRules.customRules }}
        - alert: GaragePartitionsDegraded
          annotations:
{{- if .Values.prometheusRules.additionalRuleAnnotations }}
{{ toYaml .Values.prometheusRules.additionalRuleAnnotations | indent 12 }}
{{- end }}
{{- if .Values.prometheusRules.additionalRuleGroupAnnotations.cluster }}
{{ toYaml .Values.prometheusRules.additionalRuleGroupAnnotations.cluster | indent 12 }}
{{- end }}
            summary: "Garage partitions degraded on {{ "{{" }} $labels.instance {{ "}}" }}"
            description: "Not all replicas available for some partitions for at least {{ $for }}."
          expr: cluster_partitions_all_ok{job="garage"} < cluster_partitions{job="garage"}
          for: {{ $for }}
          {{- with .Values.prometheusRules.keepFiringFor }}
          keep_firing_for: "{{ . }}"
          {{- end }}
          labels:
            severity: {{ dig "GaragePartitionsDegraded" "severity" "warning" .Values.prometheusRules.customRules }}
          {{- if or .Values.prometheusRules.additionalRuleLabels .Values.prometheusRules.additionalRuleGroupLabels.cluster }}
            {{- with .Values.prometheusRules.additionalRuleLabels }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.prometheusRules.additionalRuleGroupLabels.cluster }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
{{- end }}
{{- if not (.Values.prometheusRules.disabled.GarageNodeDisconnected | default false) }}
{{- $for := dig "GarageNodeDisconnected" "for" "3m" .Values.prometheusRules.customRules }}
        - alert: GarageNodeDisconnected
          annotations:
{{- if .Values.prometheusRules.additionalRuleAnnotations }}
{{ toYaml .Values.prometheusRules.additionalRuleAnnotations | indent 12 }}
{{- end }}
{{- if .Values.prometheusRules.additionalRuleGroupAnnotations.cluster }}
{{ toYaml .Values.prometheusRules.additionalRuleGroupAnnotations.cluster | indent 12 }}
{{- end }}
            summary: "Garage layout node disconnected"
            description: "Node {{ "{{" }} $labels.id {{ "}}" }} has been disconnected from at least half of the Garage nodes that report on it for at least {{ $for }}."
          # Every node reports itself as connected, so sum(...) == 0 could only
          # fire for a node nobody scrapes; a running but partitioned node kept
          # its own 1 and never alerted. Fire when at least half of the
          # observers (itself included) see it disconnected.
          expr: avg by (id) (cluster_layout_node_connected{job="garage"}) <= 0.5
          for: {{ $for }}
          {{- with .Values.prometheusRules.keepFiringFor }}
          keep_firing_for: "{{ . }}"
          {{- end }}
          labels:
            severity: {{ dig "GarageNodeDisconnected" "severity" "warning" .Values.prometheusRules.customRules }}
          {{- if or .Values.prometheusRules.additionalRuleLabels .Values.prometheusRules.additionalRuleGroupLabels.cluster }}
            {{- with .Values.prometheusRules.additionalRuleLabels }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.prometheusRules.additionalRuleGroupLabels.cluster }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
