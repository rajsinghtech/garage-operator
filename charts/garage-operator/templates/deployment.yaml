{{- if and (not .Values.leaderElection.enabled) (not .Values.leaderElection.unsafeAllowDisabled) }}
{{- fail "leaderElection.enabled=false is unsupported unless leaderElection.unsafeAllowDisabled=true explicitly acknowledges the single-manager safety risk" }}
{{- end }}
{{- if and (not .Values.leaderElection.enabled) (gt (int .Values.replicaCount) 1) }}
{{- fail "replicaCount must be 1 when leader election is disabled" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "garage-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garage-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "garage-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "garage-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "garage-operator.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
      - name: manager
        image: {{ include "garage-operator.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /manager
        args:
        {{- $logLevel := .Values.logLevel | default "info" }}
        {{- if or (eq $logLevel "warn") (eq $logLevel "warning") }}{{- $logLevel = "error" }}{{- end }}
        - --zap-log-level={{ $logLevel }}
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address={{ .Values.metrics.bindAddress }}
        {{- end }}
        - --leader-elect={{ .Values.leaderElection.enabled }}
        {{- if and (not .Values.leaderElection.enabled) .Values.leaderElection.unsafeAllowDisabled }}
        - --unsafe-allow-no-leader-election
        {{- end }}
        - --health-probe-bind-address=:8081
        {{- if .Values.webhooks.enabled }}
        - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
        {{- end }}
        {{- if .Values.cosi.enabled }}
        - --enable-cosi
        - --cosi-driver-name={{ .Values.cosi.driverName }}
        - --cosi-namespace={{ .Values.cosi.namespace | default .Release.Namespace }}
        {{- end }}
        {{- if .Values.gatewayAPI.enabled }}
        - --enable-gateway-api
        {{- end }}
        {{- if include "garage-operator.ingressEnabled" . }}
        - --enable-ingress
        {{- end }}
        {{- if ne .Values.clusterDomain "cluster.local" }}
        - --cluster-domain={{ .Values.clusterDomain }}
        {{- end }}
        {{- if .Values.defaultGarageImage }}
        - --default-garage-image={{ .Values.defaultGarageImage }}
        {{- end }}
        {{- $watchNS := include "garage-operator.watchNamespaceEnv" . }}
        {{- if $watchNS }}
        - --watch-namespaces={{ $watchNS }}
        {{- end }}
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        {{- if .Values.metrics.enabled }}
        - name: metrics
          containerPort: {{ include "garage-operator.metricsPort" . }}
          protocol: TCP
        {{- end }}
        - name: health
          containerPort: 8081
          protocol: TCP
        {{- if .Values.webhooks.enabled }}
        - name: webhook
          containerPort: 9443
          protocol: TCP
        {{- end }}
        {{- with .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.webhooks.enabled }}
        volumeMounts:
        - name: webhook-certs
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
        {{- end }}
      {{- if .Values.webhooks.enabled }}
      volumes:
      - name: webhook-certs
        secret:
          secretName: {{ include "garage-operator.webhookCertName" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
