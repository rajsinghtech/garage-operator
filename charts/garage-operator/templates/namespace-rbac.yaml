{{- if and .Values.rbac.create (include "garage-operator.isNamespaceScoped" .) -}}
{{- $fullname := include "garage-operator.fullname" . -}}
{{- $labels := include "garage-operator.labels" . -}}
{{- $saName := include "garage-operator.serviceAccountName" . -}}
{{- $releaseNamespace := .Release.Namespace -}}
{{- $gatewayAPIEnabled := .Values.gatewayAPI.enabled -}}
{{- $ingressEnabled := include "garage-operator.ingressEnabled" . -}}
{{- $replicationEnabled := include "garage-operator.replicationEnabled" . -}}
{{- $watchedNamespaces := splitList "," (include "garage-operator.watchedNamespaces" .) -}}
{{- range $ns := $watchedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-manager-role
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
rules:
# Core resources
- apiGroups:
  - ""
  resources:
  - configmaps
  - persistentvolumeclaims
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
# Apps resources
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Read-only: the released-environment migration walks Deployment -> ReplicaSet
# -> Pod to prove which live Garage processes share an RPC identity.
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
# Policy resources for PodDisruptionBudget
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Garage custom resources
- apiGroups:
  - garage.rajsingh.info
  resources:
  - garageadmintokens
  - garagebuckets
  - garageclusters
  - garagekeys
  - garagenodes
  - garagereferencegrants
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# GarageReplication: read-only for the admission webhook's destination
# conflict check
- apiGroups:
  - garage.rajsingh.info
  resources:
  - garagereplications
  verbs:
  - get
  - list
  - watch
{{- if $replicationEnabled }}
# GarageReplication controller (replication.enabled): consumes the
# trigger-sync annotation, writes status and runs one Job per bucket and run
- apiGroups:
  - garage.rajsingh.info
  resources:
  - garagereplications
  verbs:
  - patch
- apiGroups:
  - garage.rajsingh.info
  resources:
  - garagereplications/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
{{- end }}
# Finalizers for Garage resources
- apiGroups:
  - garage.rajsingh.info
  resources:
  - garageadmintokens/finalizers
  - garagebuckets/finalizers
  - garageclusters/finalizers
  - garagekeys/finalizers
  - garagenodes/finalizers
  verbs:
  - update
# Status updates for Garage resources
- apiGroups:
  - garage.rajsingh.info
  resources:
  - garageadmintokens/status
  - garagebuckets/status
  - garageclusters/status
  - garagekeys/status
  - garagenodes/status
  - garagereferencegrants/status
  verbs:
  - get
  - patch
  - update
# Prometheus Operator ServiceMonitor
- apiGroups:
  - monitoring.coreos.com
  resources:
  - servicemonitors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{{- if $gatewayAPIEnabled }}
# Gateway API HTTPRoutes for website-enabled buckets (spec.websiteExposure) and the web admin UI (spec.admin.webUI)
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - httproutes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{{- end }}
{{- if $ingressEnabled }}
# Ingress resources for website-enabled buckets (spec.websiteExposure) and the web admin UI (spec.admin.webUI)
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-manager-rolebinding
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ $saName }}
  namespace: {{ $releaseNamespace }}
{{- end }}
{{- end }}
