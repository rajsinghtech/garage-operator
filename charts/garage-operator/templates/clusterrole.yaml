{{- if and .Values.rbac.create (not (include "garage-operator.isNamespaceScoped" .)) -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "garage-operator.managerRoleName" . }}
  labels:
    {{- include "garage-operator.labels" . | nindent 4 }}
rules:
# Core resources
- apiGroups:
  - ""
  resources:
  - configmaps
  - persistentvolumeclaims
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Namespace selectors in GarageReferenceGrant evaluate source Namespace labels.
# Namespaces are cluster-scoped, so this permission belongs in the cluster role.
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
# Kubernetes Nodes are read to resolve spec.zoneFrom.nodeLabel and updated with
# operator-owned activation labels and HostPath claims for drain-safe node-local-pool membership.
# Cluster-scoped, so namespace-scoped installs cannot use node-local pools.
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - patch
  - update
  - watch
# Apps resources
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Read-only: the released-environment migration walks Deployment -> ReplicaSet
# -> Pod to prove which live Garage processes share an RPC identity.
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
# Policy resources for PodDisruptionBudget
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Garage custom resources
- apiGroups:
  - garage.rajsingh.info
  resources:
  - garageadmintokens
  - garagebuckets
  - garageclusters
  - garagekeys
  - garagenodes
  - garagereferencegrants
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Finalizers for Garage resources
- apiGroups:
  - garage.rajsingh.info
  resources:
  - garageadmintokens/finalizers
  - garagebuckets/finalizers
  - garageclusters/finalizers
  - garagekeys/finalizers
  - garagenodes/finalizers
  verbs:
  - update
# Status updates for Garage resources
- apiGroups:
  - garage.rajsingh.info
  resources:
  - garageadmintokens/status
  - garagebuckets/status
  - garageclusters/status
  - garagekeys/status
  - garagenodes/status
  - garagereferencegrants/status
  verbs:
  - get
  - patch
  - update
# Prometheus Operator ServiceMonitor
- apiGroups:
  - monitoring.coreos.com
  resources:
  - servicemonitors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# StorageClass inspection for PVC provisioning
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - watch
{{- end }}
