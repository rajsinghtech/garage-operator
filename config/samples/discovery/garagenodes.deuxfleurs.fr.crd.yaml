# Garage's own `garagenodes.deuxfleurs.fr` CustomResourceDefinition, for use with
# `spec.discovery.kubernetes.skipCRD: true`. Garage would otherwise
# server-side-apply this CRD itself on every discovery pass, which needs
# cluster-wide CRD write access in every Garage pod. Apply it once, as a
# cluster administrator, before the cluster in
# ../garage_v1beta2_garagecluster_kubernetes_discovery.yaml:
#
#   kubectl apply -f config/samples/discovery/garagenodes.deuxfleurs.fr.crd.yaml
#
# It lives outside the top-level samples directory because the sample
# validation (kubeconform) has no schema for apiextensions CRDs.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: garagenodes.deuxfleurs.fr
spec:
  group: deuxfleurs.fr
  names:
    kind: GarageNode
    plural: garagenodes
    singular: garagenode
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [address, hostname, port]
              properties:
                address:
                  type: string
                hostname:
                  type: string
                port:
                  type: integer
                  minimum: 0
                  maximum: 65535
