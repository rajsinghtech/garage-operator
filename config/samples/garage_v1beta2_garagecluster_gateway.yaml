# Edge Gateway Cluster Examples
#
# Gateway pods route S3/Admin traffic but store no object blocks. Metadata uses
# a small PVC by default so each Garage node identity survives Pod replacement;
# block data remains EmptyDir. In Auto layout mode, a unified cluster generates
# one GarageNode and single-replica StatefulSet per gateway. Manual unified
# members are user-owned GarageNodes. An edge gateway uses one cluster-level
# StatefulSet. Setting gateway.metadata.type to EmptyDir is an explicit
# ephemeral-identity choice and produces an admission warning.
# Change edge metadata only at replicas: 0 after the old capacity-less roles
# have retired; StatefulSet claim templates cannot be updated in place.
#
# Three patterns are shown below:
#
#  1. Unified cluster — `storage` + `gateway` in the same CR (most common,
#     see garage_v1beta2_garagecluster.yaml).
#  2. Edge gateway via clusterRef — gateway in the same namespace as storage.
#  3. Edge gateway via adminApiEndpoint — gateway in a different K8s cluster.
---
# 2. Edge gateway via clusterRef (same namespace as the storage cluster).
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  labels:
    app.kubernetes.io/name: garage-operator
    app.kubernetes.io/managed-by: kustomize
  name: garage-edge-local
  namespace: garage-operator-system
spec:
  image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690

  # Gateway tier only — no storage block. This edge gateway uses one StatefulSet
  # with a persistent metadata PVC per identity; block data stays EmptyDir.
  gateway:
    # One shared config is safe for one independently routed edge identity.
    # Create another one-replica edge CR for another route.
    replicas: 1
    # Edge gateways default to Delete/Delete for compatibility. Use Retain to
    # keep the metadata node_key after scale-down/deletion. In a unified
    # cluster, the omitted default is Retain/Retain instead.
    # pvcRetentionPolicy:
    #   whenDeleted: Retain
    #   whenScaled: Retain
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # connectTo is required when `gateway` is set without `storage`.
  connectTo:
    clusterRef:
      name: garage   # the storage GarageCluster in this namespace

  replication:
    factor: 3

  admin:
    bindPort: 3903
    adminTokenSecretRef:
      name: garage-admin-token
      key: admin-token

  s3Api:
    bindPort: 3900
    region: garage

  # Optional: for a one-replica edge tier, this address is written into the
  # gateway pod's garage.toml as rpc_public_addr so peers can dial it by name.
  # Omit it only for intentional forward-only operation; admission warns and
  # the remote storage cluster cannot dial or expose this gateway identity.
  # gateway:
  #   rpcPublicAddr: "edge-gateway.example.com:3901"

---
# 3. Edge gateway in a different K8s cluster from its storage backend.
#    Connects via the storage cluster's externally-exposed Admin API.
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: garage-edge-remote
  namespace: edge-namespace
spec:
  image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690

  gateway:
    # The edge StatefulSet has one shared config. A shared address is safe for
    # this one identity; use separate one-replica edge CRs for more routes.
    replicas: 1
    rpcPublicAddr: "edge-gateway.tailnet.example:3901"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  connectTo:
    # Shared RPC secret — must match the storage cluster's value.
    rpcSecretRef:
      name: garage-rpc-secret
      key: rpc-secret
    # Reachable Admin API endpoint of the storage cluster
    # (often via Tailscale, LoadBalancer, or VPN).
    adminApiEndpoint: "http://garage-primary.tailnet.example:3903"
    adminTokenSecretRef:
      name: storage-admin-token
      key: admin-token

  replication:
    factor: 3

  admin:
    adminTokenSecretRef:
      name: gateway-admin-token
      key: admin-token

  s3Api:
    region: garage

  publicEndpoint:
    type: NodePort
    nodePort:
      basePort: 30901
      externalAddresses:
        - "edge-node1.example.com"
        - "edge-node2.example.com"

---
# Shared admin token reused across storage and gateway clusters.
apiVersion: v1
kind: Secret
metadata:
  name: garage-admin-token
  namespace: garage-operator-system
type: Opaque
stringData:
  # Generate with: openssl rand -hex 32
  admin-token: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
