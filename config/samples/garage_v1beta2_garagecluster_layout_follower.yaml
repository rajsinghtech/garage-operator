# One shared Garage layout across two sites, with exactly one site allowed to
# change it (#442).
#
# `layoutManagement.siteRole: Writer` (or unset) is the historical behavior: the
# site stages, applies, reverts and removes layout roles. A `Follower` site runs
# its pods and reads the shared layout but never writes it, so two operators can
# never commit conflicting layout versions.
#
# 1. Writer site (apply in the cluster that owns the layout).
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: garage-us
  namespace: garage-operator-system
spec:
  image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
  zone: us-east-1
  layoutManagement:
    siteRole: Writer
  replication:
    factor: 3
  storage:
    replicas: 3
    rpcPublicAddr: garage-us-storage-{ordinal}.example.net:3901
    metadata:
      size: 10Gi
    data:
      size: 100Gi
  network:
    rpcSecretRef:
      name: garage-rpc-secret
      key: rpc-secret
  admin:
    adminTokenSecretRef:
      name: garage-admin-token
      key: admin-token
  remoteClusters:
    - name: garage-eu
      zone: eu-west-1
      connection:
        adminApiEndpoint: https://garage-eu-admin.example.net:3903
        adminTokenSecretRef:
          name: eu-admin-token
          key: admin-token
        storageRpcEndpointTemplate: garage-eu-storage-{ordinal}.example.net:3901
---
# 2. The writer declares each follower node as an external GarageNode. The
#    follower cannot assign its own roles. Repeat for every follower node, using
#    the node's Garage ID from `garage node id` or the follower's GarageNode
#    status.
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageNode
metadata:
  name: garage-eu-storage-0
  namespace: garage-operator-system
spec:
  clusterRef:
    name: garage-us
  nodeId: 563e1ac825ee3323aa441e72c26d1030d6d4414aeb3dd25287c531e7fc2bc95d
  zone: eu-west-1
  capacity: 100Gi
  external:
    address: garage-eu-storage-0.example.net
    port: 3901
---
# 3. Follower site (apply in the other cluster). A Follower needs at least one
#    remoteClusters entry and must not set connectTo; the CRD rejects both.
#    It reports `AwaitingLayoutWriter` until the writer has assigned its roles:
#
#      kubectl get garagecluster garage-eu -o jsonpath='{.status.layoutWriter}{"\n"}'
#      kubectl get garagecluster garage-eu \
#        -o jsonpath='{.status.conditions[?(@.type=="AwaitingLayoutWriter")]}{"\n"}'
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: garage-eu
  namespace: garage-operator-system
spec:
  image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
  zone: eu-west-1
  layoutManagement:
    siteRole: Follower
  replication:
    factor: 3
  storage:
    replicas: 3
    rpcPublicAddr: garage-eu-storage-{ordinal}.example.net:3901
    metadata:
      size: 10Gi
    data:
      size: 100Gi
  network:
    rpcSecretRef:
      name: garage-rpc-secret
      key: rpc-secret
  admin:
    adminTokenSecretRef:
      name: garage-admin-token
      key: admin-token
  remoteClusters:
    - name: garage-us
      zone: us-east-1
      connection:
        adminApiEndpoint: https://garage-us-admin.example.net:3903
        adminTokenSecretRef:
          name: us-admin-token
          key: admin-token
        storageRpcEndpointTemplate: garage-us-storage-{ordinal}.example.net:3901
