apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  labels:
    app.kubernetes.io/name: garage-operator
    app.kubernetes.io/managed-by: kustomize
  name: my-bucket
  namespace: garage-operator-system
spec:
  clusterRef:
    name: garage

  # Delete is the default. Use Retain to remove this resource without
  # deleting the remote Garage bucket.
  deletionPolicy: Delete

  # Bucket quotas
  quotas:
    maxSize: 10Gi
    maxObjects: 100000

  # Key permissions
  keyPermissions:
    - keyRef:
        name: app-key
      read: true
      write: true

  # Note: CORS rules are NOT supported by the operator. Configure them
  # via the S3 PutBucketCors API directly if needed.
---
# Website bucket example
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: website-bucket
  namespace: garage-operator-system
spec:
  clusterRef:
    name: garage

  website:
    enabled: true
    indexDocument: index.html
    errorDocument: error.html

  # Expose the website at <globalAlias><webApi.rootDomain> through an
  # Ingress created in the bucket's namespace (the backend Service must
  # therefore live there too — same namespace as the cluster). Exactly one
  # of ingress/gateway. An Ingress cannot rewrite the Host header, so
  # only the canonical hostname or the global alias are accepted.
  # Requires the operator's --enable-ingress flag (chart value
  # ingress.enabled=true); otherwise WebsiteExposed=False/IngressDisabled.
  websiteExposure:
    # hostnames: [site.example.com, site]
    ingress:
      ingressClassName: traefik
      # tlsSecretName: website-tls

  # Cross-namespace exposure (bucket in a different namespace from the
  # cluster) is only possible through the Gateway API: the HTTPRoute is
  # created in the bucket's namespace and reaches the cluster's web
  # Service (<cluster>-gateway for unified clusters) through a gateway
  # ReferenceGrant in the cluster's namespace. Requires the Gateway API
  # CRDs and the operator's --enable-gateway-api flag.
  # websiteExposure:
  #   gateway:
  #     parentRefs:
  #       - name: public-gateway
  #     labels:
  #       external-dns.alpha.kubernetes.io/hostname: site.example.com
  #   # Optional backend override (e.g. a ServiceImport for
  #   # multi-cluster):
  #   # backendRef:
  #   #   name: garage
  #   #   kind: ServiceImport
  #   #   group: multicluster.x-k8s.io
  #   #   namespace: garage-ns

  # Public read access
  keyPermissions:
    - keyRef:
        name: website-key
      read: true
      owner: true
---
# Metrics bucket (referenced by monitoring-key's allBuckets + bucketPermissions)
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: metrics-bucket
  namespace: garage-operator-system
spec:
  clusterRef:
    name: garage

  quotas:
    maxSize: 5Gi
---
# Log retention bucket: expire objects after 14 days, abort stale multipart
# uploads after 3 days. Garage runs the lifecycle worker daily at midnight UTC,
# so rule evaluation is asynchronous from reconciliation.
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: logs-bucket
  namespace: garage-operator-system
spec:
  clusterRef:
    name: garage

  lifecycle:
    rules:
      - id: expire-app-logs
        status: Enabled
        filter:
          prefix: app/
        expirationDays: 14
        abortIncompleteMultipartUploadDays: 3
      - id: expire-audit-logs
        status: Enabled
        filter:
          prefix: audit/
        expirationDays: 90
