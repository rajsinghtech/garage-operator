# Simple GarageCluster for COSI E2E testing
# Uses minimal configuration suitable for Kind clusters
apiVersion: v1
kind: Secret
metadata:
  name: garage-admin-token
  namespace: garage-operator-system
type: Opaque
stringData:
  admin-token: "cosi-test-admin-token-12345678901234567890"
---
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: garage
  namespace: garage-operator-system
spec:
  image: dxflrs/garage:v2.4.0@sha256:715d176efc35384bf72cf6052fd61b74b3e27a1e31a9dfedabe646bd1e92f137

  replication:
    factor: 1
    consistencyMode: consistent

  storage:
    replicas: 1
    metadata:
      size: 1Gi
    data:
      size: 5Gi

  network:
    rpcBindPort: 3901
    service:
      type: ClusterIP

  s3Api:
    bindPort: 3900
    region: garage

  admin:
    bindPort: 3903
    adminTokenSecretRef:
      name: garage-admin-token
      key: admin-token

  database:
    engine: lmdb
