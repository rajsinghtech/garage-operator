apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: allow-team-b
  namespace: storage-admin
spec:
  from:
    - kind: GarageKey
      namespace: team-b
    - kind: GarageBucket
      namespace: team-b
    # A label selector can grant the same access to a namespace family.
    # Namespaces that gain this label start matching the grant.
    - kind: GarageKey
      namespaceSelector:
        matchLabels:
          garage.example.com/application: app01
  to:
    - kind: GarageCluster
      name: my-cluster
