# Backend volume attributes (IOPS / throughput) through VolumeAttributesClass (#445).
#
# `volumeAttributesClassName` names a Kubernetes VolumeAttributesClass. New
# claims are created with it; for an existing identity the operator patches the
# BOUND claim in place, so editing the value later retunes the volume without
# recreating it. A class change never blocks Ready, scaling, rollouts or layout.
#
# Requires Kubernetes 1.34+ and a CSI driver that implements ModifyVolume. Create
# the classes first (the driver name and parameters are driver specific):
#
#   apiVersion: storage.k8s.io/v1
#   kind: VolumeAttributesClass
#   metadata:
#     name: gold
#   driverName: ebs.csi.aws.com
#   parameters:
#     iops: "6000"
#     throughput: "250"
#
# Watch progress with:
#
#   kubectl get garagenode -l garage.rajsingh.info/cluster=garage-tuned \
#     -o custom-columns=NAME:.metadata.name,VAC:.status.conditions[?(@.type==\"VolumeAttributesClassApplied\")].reason
#
# Notes:
#   - Setting the field on a cluster whose claims already exist modifies them.
#   - A configured class can be changed but not removed.
#   - Each volume takes its own value; data.paths[].volume does not inherit
#     data.volumeAttributesClassName.
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: garage-tuned
  namespace: garage-operator-system
spec:
  image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
  layoutPolicy: Auto
  zone: site-a
  replication:
    factor: 3
  storage:
    replicas: 3
    metadata:
      size: 10Gi
      volumeAttributesClassName: gold
    data:
      paths:
        - path: /data/data0
          capacity: 1Ti
          volume:
            size: 1Ti
            volumeAttributesClassName: gold
        - path: /data/data1
          capacity: 4Ti
          volume:
            size: 4Ti
            volumeAttributesClassName: bulk
