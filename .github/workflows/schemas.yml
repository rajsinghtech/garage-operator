name: Schemas

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'config/crd/**'
      - 'config/samples/**'
      - 'hack/openapi2jsonschema.py'
      - 'hack/generate-schemas.sh'
      - 'hack/preserve-crd-compat-versions.py'
      - 'Makefile'
      - '.github/workflows/schemas.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'api/**'
      - 'config/crd/**'
      - 'config/samples/**'
      - 'hack/openapi2jsonschema.py'
      - 'hack/generate-schemas.sh'
      - 'hack/preserve-crd-compat-versions.py'
      - 'Makefile'
      - '.github/workflows/schemas.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-schemas:
    name: Generate & Validate Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'

      - name: Install PyYAML
        run: pip install PyYAML==6.0.3

      - name: Generate JSON schemas
        run: make schemas

      - name: List generated schemas
        run: ls -la schemas/

      - name: Check for schema changes
        run: |
          if [[ -n "$(git status --porcelain schemas/)" ]]; then
            echo "::error::JSON schemas are out of date. Run 'make schemas' and commit the changes."
            git diff schemas/
            exit 1
          fi

      - name: Install kubeconform
        uses: jaxxstorm/action-install-gh-release@b82b2052fdf822192f2119b7e289a6f63e668bc8 # v4.0.0
        with:
          repo: yannh/kubeconform
          tag: v0.8.0
          # v3 also filters extracted filenames by this value. Keep it broad
          # enough to match both the release archive and its kubeconform binary.
          asset-name: kubeconform
          digest: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

      - name: Validate sample manifests
        run: |
          kubeconform -strict -summary \
            -kubernetes-version 1.25.0 \
            -schema-location default \
            -schema-location 'schemas/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' \
            -ignore-filename-pattern 'kustomization.yaml' \
            config/samples/*.yaml \
            config/samples/cosi/garagecluster-e2e.yaml
