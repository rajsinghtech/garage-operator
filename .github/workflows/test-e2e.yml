name: E2E Tests

on:
  push:
    branches:
      - main
    # Release tags rerun the full matrix against the exact tagged commit.
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR supersedes its older run. main and tag runs are never
  # cancelled: each merge and each release tag gets a complete matrix result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  KIND_NODE_IMAGE: kindest/node:v1.35.0@sha256:4613778f3cfcd10e615029370f5786704559103cf27bef934597ba562b269661

jobs:
  # Build the linux/amd64 operator image once and hand it to every amd64 E2E
  # job as an artifact, instead of each of the 16 jobs running its own
  # `docker build` (~90-130s apiece). core-arm64 still builds natively.
  plan:
    name: E2E Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.plan.outputs.e2e }}
      full: ${{ steps.plan.outputs.full }}
      arm64: ${{ steps.plan.outputs.arm64 }}
      cosi: ${{ steps.plan.outputs.cosi }}
      multicluster: ${{ steps.plan.outputs.multicluster }}
      external_gateway: ${{ steps.plan.outputs.external_gateway }}
      upgrade: ${{ steps.plan.outputs.upgrade }}
      ipv6: ${{ steps.plan.outputs.ipv6 }}
      single_cluster: ${{ steps.plan.outputs.single_cluster }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute E2E plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: hack/e2e-plan.sh

  build-e2e-image:
    name: Build E2E Image
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.e2e == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.39.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Build operator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          tags: garage-operator:e2e
          outputs: type=docker,dest=${{ runner.temp }}/garage-operator-e2e.tar
          cache-from: type=gha,scope=e2e-amd64
          cache-to: type=gha,mode=max,scope=e2e-amd64
          provenance: false

      - name: Upload E2E image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-operator-image
          path: ${{ runner.temp }}/garage-operator-e2e.tar
          retention-days: 1
          if-no-files-found: error

  # Guards the label-filter matrix below: every Ginkgo spec must run in some
  # shard, and only Ordered "drain-setup" prerequisites may run in two.
  e2e-shard-coverage:
    name: E2E Shard Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check shard coverage
        run: python3 hack/check-e2e-shards.py

  e2e-ginkgo:
    name: Ginkgo E2E Tests (${{ matrix.shard.name }})
    runs-on: ${{ matrix.shard.runner }}
    needs: [plan, build-e2e-image]
    if: needs.plan.outputs.e2e == 'true'
    # Keep each safety-coordinated API block in its own cluster. Manual drains
    # and dual-version topology changes intentionally wait through Garage's
    # production proof windows, while each management-handle block starts a
    # real Garage. Isolation preserves cleanup/debug margin under this cap.
    # node-local-drain can now also wait through one BLOCK_GC_DELAY (~610s)
    # while a drain-setup spec joins a newly added identity, then another
    # 610s for the drain spec itself, so the cap needs that stacked budget.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: KIND_VERSION=v0.33.0 hack/install-kind.sh

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.3

      # controller-gen and kustomize are version-suffixed under bin/ by the
      # Makefile's go-install-tool; caching them skips a ~60-90s compile per
      # shard (make install/deploy still regenerate manifests from them).
      - name: Cache Makefile tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/controller-gen
            bin/controller-gen-*
            bin/kustomize
            bin/kustomize-*
          key: e2e-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      # amd64 shards reuse the image from build-e2e-image; core-arm64 builds
      # natively in BeforeSuite so the arm64 image itself is exercised.
      - name: Load shared E2E image
        if: matrix.shard.runner != 'ubuntu-24.04-arm'
        uses: ./.github/actions/load-e2e-image

      - name: Run Ginkgo e2e tests
        env:
          E2E_GARAGE_VERSION_IMAGE: ${{ matrix.shard.garage_image }}
          E2E_GARAGE_VERSION_EXPECT: ${{ matrix.shard.garage_version }}
          E2E_SKIP_IMAGE_BUILD: ${{ matrix.shard.runner != 'ubuntu-24.04-arm' }}
        # Generated code/manifests drift is gated by verify-generated in
        # test.yml, so CI skips the codegen/fmt/vet prerequisites here.
        run: make test-e2e E2E_SKIP_CODEGEN=true GINKGO_LABEL_FILTER='${{ matrix.shard.filter }}' KIND_CLUSTER='garage-e2e-${{ matrix.shard.name }}' KIND_CONFIG_E2E='${{ matrix.shard.kind_config }}'

      - name: Collect debug info
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p /tmp/e2e-debug
          # shellcheck source=hack/e2e-common.sh
          source hack/e2e-common.sh
          clusters="$(timeout --foreground 15s kind get clusters 2>/dev/null || true)"
          printf '%s\n' "$clusters" > /tmp/e2e-debug/clusters-post-cleanup.txt
          while IFS= read -r cluster; do
            [ -n "$cluster" ] || continue
            kubectl --context "kind-$cluster" get all -A \
              --request-timeout=15s \
              > "/tmp/e2e-debug/${cluster}-resources.txt" 2>&1 || true
            kubectl --context "kind-$cluster" logs deployment/garage-operator-controller-manager \
              -n garage-operator-system --tail=200 --pod-running-timeout=15s \
              --request-timeout=15s \
              > "/tmp/e2e-debug/${cluster}-operator.txt" 2>&1 || true
          done <<< "$clusters"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ginkgo-e2e-logs-${{ matrix.shard.name }}
          path: /tmp/e2e-debug/
          retention-days: 7

  # Aggregator gate: branch protection requires a status check named exactly
  # "Ginkgo E2E Tests". The sharded matrix above produces per-shard checks
  # ("Ginkgo E2E Tests (core)", ...), so this single job preserves the required
  # check name and passes only when every shard succeeded.
  e2e-ginkgo-result:
    name: Ginkgo E2E Tests
    runs-on: ubuntu-latest
    needs: [plan, e2e-ginkgo]
    if: always()
    steps:
      - name: Verify all Ginkgo shards passed
        run: |
          if [ '${{ needs.plan.result }}' != 'success' ]; then
            echo "::error::E2E Plan did not succeed (${{ needs.plan.result }})"
            exit 1
          fi
          if [ '${{ needs.plan.outputs.e2e }}' != 'true' ]; then
            echo "Ginkgo E2E skipped (docs-only PR)."
            exit 0
          fi
          result='${{ needs.e2e-ginkgo.result }}'
          echo "Aggregate shard result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::One or more Ginkgo E2E shards did not succeed ($result)"
            exit 1
          fi
          echo "All Ginkgo E2E shards passed."

  e2e-cluster:
    name: Single-Cluster E2E Tests
    runs-on: ubuntu-latest
    needs: [plan, build-e2e-image]
    if: needs.plan.outputs.e2e == 'true' && needs.plan.outputs.single_cluster == 'true'
    timeout-minutes: 58
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load shared E2E image
        uses: ./.github/actions/load-e2e-image

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: KIND_VERSION=v0.33.0 hack/install-kind.sh

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.3

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.3.2

      - name: Run single-cluster e2e tests
        run: make test-e2e-cluster E2E_SCRIPT_ARGS=--skip-build

      # The script's trap dumps operator logs + resources to /tmp/e2e-debug
      # before tearing down kind, so the upload below captures real state. If
      # the script crashes before its trap fires, this artifact will be empty.
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cluster-e2e-logs
          path: /tmp/e2e-debug/
          retention-days: 7
          if-no-files-found: warn


  e2e-cosi:
    name: COSI E2E Tests
    runs-on: ubuntu-latest
    needs: [plan, build-e2e-image]
    if: needs.plan.outputs.e2e == 'true' && needs.plan.outputs.cosi == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load shared E2E image
        uses: ./.github/actions/load-e2e-image

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: KIND_VERSION=v0.33.0 hack/install-kind.sh

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.3

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.3.2

      - name: Run COSI e2e tests
        run: make test-e2e-cosi E2E_SCRIPT_ARGS=--skip-build

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cosi-e2e-logs
          path: /tmp/e2e-debug/
          retention-days: 7
          if-no-files-found: warn

  e2e-multicluster:
    name: Multi-Cluster E2E Tests
    runs-on: ubuntu-latest
    needs: [plan, build-e2e-image]
    if: needs.plan.outputs.e2e == 'true' && needs.plan.outputs.multicluster == 'true'
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load shared E2E image
        uses: ./.github/actions/load-e2e-image

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: KIND_VERSION=v0.33.0 hack/install-kind.sh

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.3

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.3.2

      - name: Run multi-cluster e2e tests
        run: make test-e2e-multicluster E2E_SCRIPT_ARGS=--skip-build

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: multicluster-e2e-logs
          path: /tmp/e2e-debug/
          retention-days: 7
          if-no-files-found: warn

  e2e-external-gateway:
    name: External Gateway E2E Tests
    runs-on: ubuntu-latest
    needs: [plan, build-e2e-image]
    if: needs.plan.outputs.e2e == 'true' && needs.plan.outputs.external_gateway == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load shared E2E image
        uses: ./.github/actions/load-e2e-image

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: KIND_VERSION=v0.33.0 hack/install-kind.sh

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.3

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.3.2

      - name: Run external gateway e2e tests
        run: make test-e2e-external-gateway E2E_SCRIPT_ARGS=--skip-build

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: external-gateway-e2e-logs
          path: /tmp/e2e-debug/
          retention-days: 7
          if-no-files-found: warn

  e2e-upgrade:
    # Installs the latest released chart (v0.8.1), lets it create a live
    # GarageCluster, bucket and key, upgrades to this build, and asserts no
    # disruption (in-cluster S3/health probe every second) and no state loss
    # (resource identities, credential bytes, layout roles, object content).
    name: Upgrade E2E Tests
    runs-on: ubuntu-latest
    needs: [plan, build-e2e-image]
    if: needs.plan.outputs.e2e == 'true' && needs.plan.outputs.upgrade == 'true'
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load shared E2E image
        uses: ./.github/actions/load-e2e-image

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: KIND_VERSION=v0.33.0 hack/install-kind.sh

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.3

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.3.2

      - name: Run upgrade e2e tests
        run: make test-e2e-upgrade E2E_SCRIPT_ARGS=--skip-build

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: upgrade-e2e-logs
          path: /tmp/e2e-debug/
          retention-days: 7
          if-no-files-found: warn

  e2e-ipv6:
    name: IPv6 Dual-Stack E2E Tests
    runs-on: ubuntu-latest
    needs: [plan, build-e2e-image]
    if: needs.plan.outputs.e2e == 'true' && needs.plan.outputs.ipv6 == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load shared E2E image
        uses: ./.github/actions/load-e2e-image

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: KIND_VERSION=v0.33.0 hack/install-kind.sh

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.3

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.3.2

      - name: Run IPv6 dual-stack e2e tests
        run: make test-e2e-ipv6 E2E_SCRIPT_ARGS=--skip-build

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ipv6-e2e-logs
          path: /tmp/e2e-debug/
          retention-days: 7
          if-no-files-found: warn

  # Aggregate gate for branch protection ("E2E Tests").
  # Fails if any planned job failed or was cancelled, while allowing skipped
  # jobs on docs-only or path-filtered PRs when plan itself succeeded.
  e2e-result:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs:
      - plan
      - build-e2e-image
      - e2e-shard-coverage
      - e2e-ginkgo
      - e2e-cluster
      - e2e-cosi
      - e2e-multicluster
      - e2e-external-gateway
      - e2e-upgrade
      - e2e-ipv6
    if: always()
    steps:
      - name: Verify E2E suite results
        run: |
          if [ '${{ needs.plan.result }}' != 'success' ]; then
            echo "::error::E2E Plan did not succeed (${{ needs.plan.result }})"
            exit 1
          fi
          if [ '${{ needs.e2e-shard-coverage.result }}' != 'success' ]; then
            echo "::error::E2E Shard Coverage did not succeed (${{ needs.e2e-shard-coverage.result }})"
            exit 1
          fi
          if [ '${{ needs.plan.outputs.e2e }}' != 'true' ]; then
            echo "All E2E jobs skipped (docs-only PR)."
            exit 0
          fi
          check_job() {
            local name="$1" enabled="$2" res="$3"
            if [ "$enabled" = "true" ] && [ "$res" != "success" ]; then
              echo "::error::${name} was required but finished with ${res}"
              return 1
            fi
            if [ "$res" != "success" ] && [ "$res" != "skipped" ]; then
              echo "::error::${name} finished with ${res}"
              return 1
            fi
            echo "${name}: ${res}"
          }
          fail=0
          check_job "Build E2E Image" "true" '${{ needs.build-e2e-image.result }}' || fail=1
          check_job "Ginkgo E2E Tests" "true" '${{ needs.e2e-ginkgo.result }}' || fail=1
          check_job "Single-Cluster E2E Tests" '${{ needs.plan.outputs.single_cluster }}' '${{ needs.e2e-cluster.result }}' || fail=1
          check_job "COSI E2E Tests" '${{ needs.plan.outputs.cosi }}' '${{ needs.e2e-cosi.result }}' || fail=1
          check_job "Multi-Cluster E2E Tests" '${{ needs.plan.outputs.multicluster }}' '${{ needs.e2e-multicluster.result }}' || fail=1
          check_job "External Gateway E2E Tests" '${{ needs.plan.outputs.external_gateway }}' '${{ needs.e2e-external-gateway.result }}' || fail=1
          check_job "Upgrade E2E Tests" '${{ needs.plan.outputs.upgrade }}' '${{ needs.e2e-upgrade.result }}' || fail=1
          check_job "IPv6 Dual-Stack E2E Tests" '${{ needs.plan.outputs.ipv6 }}' '${{ needs.e2e-ipv6.result }}' || fail=1
          exit "$fail"
