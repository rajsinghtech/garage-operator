name: E2E Tests

on:
  push:
    branches:
      - main
    # Release tags rerun the full matrix against the exact tagged commit.
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR supersedes its older run. main and tag runs are never
  # cancelled: each merge and each release tag gets a complete matrix result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  KIND_NODE_IMAGE: kindest/node:v1.35.0@sha256:4613778f3cfcd10e615029370f5786704559103cf27bef934597ba562b269661

jobs:
  # Build the linux/amd64 operator image once and hand it to every amd64 E2E
  # job as an artifact, instead of each of the 16 jobs running its own
  # `docker build` (~90-130s apiece). core-arm64 still builds natively.
  build-e2e-image:
    name: Build E2E Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.39.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Build operator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          tags: garage-operator:e2e
          outputs: type=docker,dest=${{ runner.temp }}/garage-operator-e2e.tar
          cache-from: type=gha,scope=e2e-amd64
          cache-to: type=gha,mode=max,scope=e2e-amd64
          provenance: false

      - name: Upload E2E image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-operator-image
          path: ${{ runner.temp }}/garage-operator-e2e.tar
          retention-days: 1
          if-no-files-found: error

  # Guards the label-filter matrix below: every Ginkgo spec must run in some
  # shard, and only Ordered "drain-setup" prerequisites may run in two.
  e2e-shard-coverage:
    name: E2E Shard Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Check shard coverage
        run: |
          python -m pip install --quiet 'pyyaml==6.0.3'
          python hack/check-e2e-shards.py

  e2e-ginkgo:
    name: Ginkgo E2E Tests (${{ matrix.shard.name }})
    runs-on: ${{ matrix.shard.runner }}
    needs: [build-e2e-image]
    # Keep each safety-coordinated API block in its own cluster. Manual drains
    # and dual-version topology changes intentionally wait through Garage's
    # production proof windows, while each management-handle block starts a
    # real Garage. Isolation preserves cleanup/debug margin under this cap.
    timeout-minutes: 58
    strategy:
      fail-fast: false
      matrix:
        # The Ginkgo suite is split into 6 primary shards by Ginkgo label so
        # each runs on its own Kind cluster in parallel.
        # The "layout" shard is a catch-all complement so any spec not explicitly
        # claimed by a dedicated shard (including future unlabeled Describes) still
        # runs exactly once — no coverage is silently dropped. The six primary
        # filters are disjoint and exhaustive over the suite's labels.
        # garage-floor runs the version-compatibility spec on the oldest Garage
        # release the docs claim to support (v2.0.0 is the only v2.0.x release);
        # the rest of the suite runs the operator's default image. The nightly
        # main-v2 canary (garage-canary.yml) runs the same spec on Garage's
        # development branch. k8s-discovery is the single lane that runs Garage
        # with kubernetes_discovery enabled and namespaced RBAC.
        # Drain specs (Label "drain") wait through Garage's 610s block-GC
        # barrier. Each primary shard runs with "&& !drain"; a paired *-drain
        # shard runs only the drain specs plus the Ordered setup specs they
        # depend on (Label "drain-setup", which therefore run in both). The
        # manual-mode drain is that Describe's last spec and depends on all of
        # it, so api-manual-mode keeps it inline. core-arm64 runs the full core
        # filter including its drain.
        # core-arm64 re-runs the core shard on GitHub's free arm64 runners —
        # the operator ships multi-arch images (docker.yml) but nothing
        # exercised them; arch-specific breakage surfaced only on user
        # clusters (arm64 SBCs are a common Garage substrate).
        shard:
          - name: core
            runner: ubuntu-latest
            filter: "(gateway || manager || webhooks) && !drain"
            kind_config: ""
          - name: core-drain
            runner: ubuntu-latest
            filter: "gateway && (drain || drain-setup)"
            kind_config: ""
          - name: api-dual-version
            runner: ubuntu-latest
            filter: "dual-version"
            kind_config: ""
          - name: api-manual-mode
            runner: ubuntu-latest
            filter: "manual-mode"
            kind_config: ""
          - name: api-management-handle
            runner: ubuntu-latest
            filter: "management-handle"
            kind_config: ""
          # factor-migration is split out of the catch-all because it is a
          # destructive whole-cluster purge with its own multi-minute barriers.
          # Together with the drain in auto-mode-pernode (a single ~13m spec,
          # bounded by Garage's BLOCK_GC_DELAY) it pushed the catch-all past the
          # 40m Go timeout on a loaded runner.
          - name: factor-migration
            runner: ubuntu-latest
            filter: "factor-migration"
            kind_config: ""
          - name: layout
            runner: ubuntu-latest
            filter: "!(gateway || manager || webhooks || external-gateway || dual-version || manual-mode || management-handle || node-local-pools || factor-migration || garage-versions || k8s-discovery || replication) && !drain"
            kind_config: ""
          - name: layout-drain
            runner: ubuntu-latest
            filter: "auto-mode-pernode && (drain || drain-setup)"
            kind_config: ""
          # replication runs two GarageClusters and real rclone Jobs
          # (GarageReplication) with the operator's --enable-replication.
          - name: replication
            runner: ubuntu-latest
            filter: "replication"
            kind_config: ""
          - name: node-local-pools
            runner: ubuntu-latest
            filter: "node-local-pools && !drain"
            kind_config: "test/e2e/kind-node-local-pools.yaml"
          - name: node-local-drain
            runner: ubuntu-latest
            filter: "node-local-pools && (drain || drain-setup)"
            kind_config: "test/e2e/kind-node-local-pools.yaml"
          - name: garage-floor
            runner: ubuntu-latest
            filter: "garage-versions"
            kind_config: ""
            garage_image: "dxflrs/garage:v2.0.0@sha256:15b40e0dddd2e611aa746ff6f7c3bfe9f22735e4a2cc29e0abd89c268e9b79d9"
            garage_version: "2.0.0"
          - name: k8s-discovery
            runner: ubuntu-latest
            filter: "k8s-discovery"
            kind_config: ""
          - name: core-arm64
            runner: ubuntu-24.04-arm
            filter: "gateway || manager || webhooks"
            kind_config: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: KIND_VERSION=v0.33.0 hack/install-kind.sh

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.2

      # controller-gen and kustomize are version-suffixed under bin/ by the
      # Makefile's go-install-tool; caching them skips a ~60-90s compile per
      # shard (make install/deploy still regenerate manifests from them).
      - name: Cache Makefile tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/controller-gen
            bin/controller-gen-*
            bin/kustomize
            bin/kustomize-*
          key: e2e-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      # amd64 shards reuse the image from build-e2e-image; core-arm64 builds
      # natively in BeforeSuite so the arm64 image itself is exercised.
      - name: Load shared E2E image
        if: matrix.shard.runner != 'ubuntu-24.04-arm'
        uses: ./.github/actions/load-e2e-image

      - name: Run Ginkgo e2e tests
        env:
          E2E_GARAGE_VERSION_IMAGE: ${{ matrix.shard.garage_image }}
          E2E_GARAGE_VERSION_EXPECT: ${{ matrix.shard.garage_version }}
          E2E_SKIP_IMAGE_BUILD: ${{ matrix.shard.runner != 'ubuntu-24.04-arm' }}
        # Generated code/manifests drift is gated by verify-generated in
        # test.yml, so CI skips the codegen/fmt/vet prerequisites here.
        run: make test-e2e E2E_SKIP_CODEGEN=true GINKGO_LABEL_FILTER='${{ matrix.shard.filter }}' KIND_CLUSTER='garage-e2e-${{ matrix.shard.name }}' KIND_CONFIG_E2E='${{ matrix.shard.kind_config }}'

      - name: Collect debug info
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p /tmp/e2e-debug
          # shellcheck source=hack/e2e-common.sh
          source hack/e2e-common.sh
          clusters="$(timeout --foreground 15s kind get clusters 2>/dev/null || true)"
          printf '%s\n' "$clusters" > /tmp/e2e-debug/clusters-post-cleanup.txt
          while IFS= read -r cluster; do
            [ -n "$cluster" ] || continue
            kubectl --context "kind-$cluster" get all -A \
              --request-timeout=15s \
              > "/tmp/e2e-debug/${cluster}-resources.txt" 2>&1 || true
            kubectl --context "kind-$cluster" logs deployment/garage-operator-controller-manager \
              -n garage-operator-system --tail=200 --pod-running-timeout=15s \
              --request-timeout=15s \
              > "/tmp/e2e-debug/${cluster}-operator.txt" 2>&1 || true
          done <<< "$clusters"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ginkgo-e2e-logs-${{ matrix.shard.name }}
          path: /tmp/e2e-debug/
          retention-days: 7

  # Aggregator gate: branch protection requires a status check named exactly
  # "Ginkgo E2E Tests". The sharded matrix above produces per-shard checks
  # ("Ginkgo E2E Tests (core)", ...), so this single job preserves the required
  # check name and passes only when every shard succeeded.
  e2e-ginkgo-result:
    name: Ginkgo E2E Tests
    runs-on: ubuntu-latest
    needs: [e2e-ginkgo]
    if: always()
    steps:
      - name: Verify all Ginkgo shards passed
        run: |
          result='${{ needs.e2e-ginkgo.result }}'
          echo "Aggregate shard result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::One or more Ginkgo E2E shards did not succeed ($result)"
            exit 1
          fi
          echo "All Ginkgo E2E shards passed."

  e2e-cluster:
    name: Single-Cluster E2E Tests
    runs-on: ubuntu-latest
    needs: [build-e2e-image]
    timeout-minutes: 58
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load shared E2E image
        uses: ./.github/actions/load-e2e-image

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: KIND_VERSION=v0.33.0 hack/install-kind.sh

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.2

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.3.2

      - name: Run single-cluster e2e tests
        run: make test-e2e-cluster E2E_SCRIPT_ARGS=--skip-build

      # The script's trap dumps operator logs + resources to /tmp/e2e-debug
      # before tearing down kind, so the upload below captures real state. If
      # the script crashes before its trap fires, this artifact will be empty.
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cluster-e2e-logs
          path: /tmp/e2e-debug/
          retention-days: 7
          if-no-files-found: warn


  e2e-cosi:
    name: COSI E2E Tests
    runs-on: ubuntu-latest
    needs: [build-e2e-image]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load shared E2E image
        uses: ./.github/actions/load-e2e-image

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: KIND_VERSION=v0.33.0 hack/install-kind.sh

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.2

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
