      - name: Run COSI e2e tests
        run: make test-e2e-cosi E2E_SCRIPT_ARGS=--skip-build

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cosi-e2e-logs
          path: /tmp/e2e-debug/
          retention-days: 7
          if-no-files-found: warn

  e2e-multicluster:
    name: Multi-Cluster E2E Tests
    runs-on: ubuntu-latest
    needs: [build-e2e-image]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load shared E2E image
        uses: ./.github/actions/load-e2e-image

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: KIND_VERSION=v0.33.0 hack/install-kind.sh

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.2

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
