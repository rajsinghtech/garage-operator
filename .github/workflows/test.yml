name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module files are tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Run tests
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: cover.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  race:
    name: Race Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with race detector
        run: make test-race

  # Guards against committed generated files (CRDs, Helm chart CRDs, JSON
  # schemas, deepcopy) drifting from the Go source. `make test` regenerates
  # these as a prerequisite but never diffs the result, helm.yml only compares
  # the two committed CRD copies to each other, and schemas.yml regenerates
  # schemas from the (possibly stale) committed CRDs — so a stale CRD slipped
  # through all three. This job regenerates from source and fails on any diff.
  verify-generated:
    name: Verify Generated Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install PyYAML
        run: pip install PyYAML==6.0.3

      - name: Verify generated files are in sync with the Go types
        run: make verify-generate

      - name: Install kubeconform
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: yannh/kubeconform
          tag: v0.8.0
          # v3 also filters extracted filenames by this value. Keep it broad
          # enough to match both the release archive and its kubeconform binary.
          asset-name: kubeconform
          digest: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

      - name: Validate generated schemas against all samples
        run: make validate-manifests

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.2.4

      - name: Lint and render Helm chart
        run: |
          helm lint charts/garage-operator
          helm template garage-operator charts/garage-operator \
            --namespace garage-operator-system >/dev/null

  required-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [test, race, verify-generated]
    if: always()
    steps:
      - name: Require unit, race, generated-artifact, schema, and chart checks
        run: |
          for result in \
            '${{ needs.test.result }}' \
            '${{ needs.race.result }}' \
            '${{ needs.verify-generated.result }}'; do
            if [ "$result" != success ]; then
              echo "::error::A required test component did not succeed ($result)"
              exit 1
            fi
          done
